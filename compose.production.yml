name: ${COMPOSE_PROJECT_NAME:-gestorconta-production}

x-app-service: &app-service
  build:
    context: .
  image: gestorconta-app:${APP_IMAGE_TAG:-local}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  networks:
    - backend

x-database-environment: &database-environment
  NODE_ENV: production
  STORAGE_DRIVER: database
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-gestorconta}
  DB_USER: ${POSTGRES_USER:-gestorconta}
  DB_PASSWORD_FILE: /run/secrets/postgres_password
  DB_SSL: "false"
  DB_AUTO_INIT: "false"
  DB_POOL_MAX: ${DB_POOL_MAX:-8}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestorconta}
      POSTGRES_USER: ${POSTGRES_USER:-gestorconta}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - wal_compression=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 256m
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    <<: *app-service
    restart: "no"
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    environment: *database-environment
    secrets:
      - postgres_password
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  initialize:
    <<: *app-service
    restart: "no"
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    environment: *database-environment
    secrets:
      - postgres_password
    command: ["npm", "run", "db:init:deployment"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  bootstrap:
    <<: *app-service
    profiles: ["tools"]
    restart: "no"
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    environment:
      <<: *database-environment
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets:
      - postgres_password
      - bootstrap_admin_password
    command: ["npm", "run", "db:bootstrap-admin"]
    depends_on:
      initialize:
        condition: service_completed_successfully

  uploads-init:
    <<: *app-service
    user: "0:0"
    restart: "no"
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    read_only: false
    tmpfs: []
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/apps/api/data/uploads/rut &&
        chown -R 10001:10001 /app/apps/api/data/uploads &&
        chmod 750 /app/apps/api/data/uploads /app/apps/api/data/uploads/rut
    volumes:
      - uploads-data:/app/apps/api/data/uploads

  api:
    <<: *app-service
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1536m
    mem_reservation: 384m
    cpus: 2.5
    environment:
      <<: *database-environment
      PORT: "4000"
      ALLOW_DEMO_SEEDS: "false"
      AUTH_CSRF_SECRET_FILE: /run/secrets/auth_csrf_secret
      AUTH_COOKIE_SAME_SITE: Lax
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Define PUBLIC_ORIGIN en .env.production}
      HTTPS_CONFIRMED: "true"
      TRUSTED_PROXY_ADDRESSES: 172.31.241.10
      HTTP_SHUTDOWN_TIMEOUT_MS: ${HTTP_SHUTDOWN_TIMEOUT_MS:-15000}
    secrets:
      - postgres_password
      - auth_csrf_secret
    command: ["npm", "run", "start:api"]
    volumes:
      - uploads-data:/app/apps/api/data/uploads
    depends_on:
      initialize:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    <<: *app-service
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 1.0
    environment:
      NODE_ENV: production
      PORT: "3000"
      HTTPS_CONFIRMED: "true"
      FRONTEND_CSP_CONNECT_SOURCES: ""
      HTTP_SHUTDOWN_TIMEOUT_MS: ${HTTP_SHUTDOWN_TIMEOUT_MS:-15000}
    command: ["npm", "run", "start:web"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    ports:
      - "${PUBLIC_HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - tls_certificate
      - tls_private_key
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      backend:
        ipv4_address: 172.31.241.10
      edge: {}

volumes:
  postgres-data:
  uploads-data:

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.241.0/24
  edge:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Define POSTGRES_PASSWORD_FILE en .env.production}
  auth_csrf_secret:
    file: ${AUTH_CSRF_SECRET_FILE:?Define AUTH_CSRF_SECRET_FILE en .env.production}
  bootstrap_admin_password:
    file: ${BOOTSTRAP_ADMIN_PASSWORD_FILE:?Define BOOTSTRAP_ADMIN_PASSWORD_FILE en .env.production}
  tls_certificate:
    file: ${TLS_CERT_FILE:?Define TLS_CERT_FILE en .env.production}
  tls_private_key:
    file: ${TLS_KEY_FILE:?Define TLS_KEY_FILE en .env.production}
