name: gestorconta-test

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestorconta}
      POSTGRES_USER: ${POSTGRES_USER:-gestorconta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD fuera del repositorio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build: .
    restart: "no"
    environment: &api-environment
      NODE_ENV: production
      STORAGE_DRIVER: database
      DATABASE_URL: postgresql://${POSTGRES_USER:-gestorconta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gestorconta}
      DB_SSL: "false"
      DB_AUTO_INIT: "false"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  initialize:
    build: .
    restart: "no"
    environment: *api-environment
    command: ["npm", "run", "db:init:deployment"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  uploads-init:
    build: .
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/apps/api/data/uploads/rut &&
        chown -R 10001:10001 /app/apps/api/data/uploads &&
        chmod 750 /app/apps/api/data/uploads /app/apps/api/data/uploads/rut
    volumes:
      - uploads-data:/app/apps/api/data/uploads

  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *api-environment
      PORT: "4000"
      ALLOW_DEMO_SEEDS: "false"
      AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET:?Define AUTH_CSRF_SECRET fuera del repositorio}
      AUTH_COOKIE_SAME_SITE: Lax
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Define PUBLIC_ORIGIN, por ejemplo https://pruebas.example.com}
      HTTPS_CONFIRMED: "true"
      TRUSTED_PROXY_ADDRESSES: ${TRUSTED_PROXY_ADDRESSES:-172.31.240.10}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      HTTP_SHUTDOWN_TIMEOUT_MS: ${HTTP_SHUTDOWN_TIMEOUT_MS:-10000}
    command: ["npm", "run", "start:api"]
    volumes:
      - uploads-data:/app/apps/api/data/uploads
    depends_on:
      initialize:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HTTPS_CONFIRMED: "true"
      FRONTEND_CSP_CONNECT_SOURCES: ""
      HTTP_SHUTDOWN_TIMEOUT_MS: ${HTTP_SHUTDOWN_TIMEOUT_MS:-10000}
    command: ["npm", "run", "start:web"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      default:
        ipv4_address: 172.31.240.10

  bootstrap:
    build: .
    profiles: ["tools"]
    restart: "no"
    environment:
      <<: *api-environment
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ["npm", "run", "db:bootstrap-admin"]
    depends_on:
      initialize:
        condition: service_completed_successfully

volumes:
  postgres-data:
  uploads-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.240.0/24
